<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tricore Admin Dashboard</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-100 font-sans antialiased">

    <!-- LOGIN SCREEN -->
    <div id="login-screen" class="min-h-screen flex items-center justify-center bg-slate-900 p-4">
        <form id="login-form" class="bg-white p-8 rounded-lg shadow-xl w-full max-w-md">
            <h1 class="text-2xl font-extrabold text-slate-900 mb-6 text-center">TRICORE Admin Portal</h1>
            <div class="mb-4">
                <label class="block text-xs font-bold text-slate-500 mb-1">ADMIN EMAIL</label>
                <input type="email" id="email" required class="w-full border p-2.5 rounded text-sm focus:outline-none focus:border-blue-600" value="admin@tricorerealty.com">
            </div>
            <div class="mb-6">
                <label class="block text-xs font-bold text-slate-500 mb-1">PASSWORD</label>
                <input type="password" id="password" required class="w-full border p-2.5 rounded text-sm focus:outline-none focus:border-blue-600" placeholder="Enter password">
            </div>
            <button type="submit" id="login-btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded text-sm transition">Login to Dashboard</button>
        </form>
    </div>

    <!-- DASHBOARD PANEL -->
    <div id="dashboard-screen" class="hidden min-h-screen flex-col">
        <header class="bg-slate-900 text-white px-6 py-4 flex justify-between items-center shadow-md">
            <h1 class="text-xl font-extrabold">TRICORE Admin Control Panel</h1>
            <button onclick="handleLogout()" class="bg-red-600 hover:bg-red-700 text-xs font-bold px-3 py-1.5 rounded transition">Logout</button>
        </header>

        <div class="max-w-7xl mx-auto w-full px-6 pt-6">
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
                <div class="bg-white p-4 rounded border text-center"><p class="text-xs text-slate-500 font-bold uppercase">Total Properties</p><p id="stat-total" class="text-2xl font-extrabold text-slate-800">0</p></div>
                <div class="bg-white p-4 rounded border text-center"><p class="text-xs text-emerald-600 font-bold uppercase">Published</p><p id="stat-published" class="text-2xl font-extrabold text-emerald-600">0</p></div>
                <div class="bg-white p-4 rounded border text-center"><p class="text-xs text-amber-600 font-bold uppercase">Drafts</p><p id="stat-drafts" class="text-2xl font-extrabold text-amber-600">0</p></div>
                <div class="bg-white p-4 rounded border text-center"><p class="text-xs text-purple-600 font-bold uppercase">Recommended/Featured</p><p id="stat-featured" class="text-2xl font-extrabold text-purple-600">0</p></div>
            </div>

            <div class="flex justify-between items-center mb-4">
                <h2 class="text-lg font-bold text-slate-800">All Properties</h2>
                <button onclick="openForm()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold text-xs px-4 py-2 rounded transition">+ Add New Property</button>
            </div>

            <div class="bg-white rounded border overflow-x-auto shadow-sm">
                <table class="w-full text-left text-xs border-collapse">
                    <thead class="bg-slate-50 border-b text-slate-500 font-bold uppercase">
                        <tr>
                            <th class="p-3">Title</th>
                            <th class="p-3">Region</th>
                            <th class="p-3">Price</th>
                            <th class="p-3">Recommended</th>
                            <th class="p-3">Status</th>
                            <th class="p-3 text-right">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="properties-list" class="divide-y divide-slate-100 font-medium">
                        <tr><td colspan="6" class="p-4 text-center text-slate-400">Loading properties...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- MODAL FORM -->
    <div id="property-modal" class="hidden fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-lg shadow-2xl max-w-3xl w-full p-6 max-h-[92vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-4 border-b pb-3">
                <h3 id="modal-title" class="text-lg font-bold text-slate-900">Add Property</h3>
                <button type="button" onclick="closeForm()" class="text-slate-400 hover:text-slate-700 font-bold text-xl">×</button>
            </div>

            <div class="flex space-x-4 border-b mb-4 text-xs font-bold text-slate-500">
                <button type="button" onclick="switchAdminTab('tab-basic', this)" class="admin-tab text-blue-600 border-b-2 border-blue-600 pb-2">Basic</button>
                <button type="button" onclick="switchAdminTab('tab-details', this)" class="admin-tab border-b-2 border-transparent pb-2 hover:text-blue-600">Details</button>
                <button type="button" onclick="switchAdminTab('tab-media', this)" class="admin-tab border-b-2 border-transparent pb-2 hover:text-blue-600">Media</button>
                <button type="button" onclick="switchAdminTab('tab-amenities', this)" class="admin-tab border-b-2 border-transparent pb-2 hover:text-blue-600">Amenities</button>
            </div>

            <form id="property-form" class="text-xs space-y-4">
                <input type="hidden" id="p-id">

                <!-- TAB 1: BASIC -->
                <div id="tab-basic" class="tab-content space-y-3">
                    <div>
                        <label class="font-bold block mb-1">Property Title</label>
                        <input type="text" id="p-title" required class="w-full border p-2 rounded" placeholder="1 BHK Flat In Sagar Park Hsg Society For Sale In Ghatkopar">
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="font-bold block mb-1">Price (e.g. ₹98 L or ₹1.12 Cr)</label>
                            <input type="text" id="p-price" required class="w-full border p-2 rounded">
                        </div>
                        <div>
                            <label class="font-bold block mb-1">Region</label>
                            <select id="p-region" class="w-full border p-2 rounded">
                                <option value="All Mumbai">All Mumbai</option>
                                <option value="All Thane">All Thane</option>
                                <option value="Navi Mumbai">Navi Mumbai</option>
                                <option value="Virar & Vasai">Virar & Vasai</option>
                                <option value="Lonavala">Lonavala</option>
                            </select>
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="font-bold block mb-1">Location / Address</label>
                            <input type="text" id="p-location" required class="w-full border p-2 rounded" placeholder="Amrut Nagar Cir, Ghatkopar West">
                        </div>
                        <div>
                            <label class="font-bold block mb-1">Category</label>
                            <select id="p-category" class="w-full border p-2 rounded">
                                <option value="1, 2, 3, 4 BHK Flats">1, 2, 3, 4 BHK Flats</option>
                                <option value="Bungalows & Houses">Bungalows & Houses</option>
                                <option value="Plots / Land">Plots / Land</option>
                                <option value="Commercial">Commercial</option>
                            </select>
                        </div>
                    </div>
                    
                    <!-- RECOMMENDED / FEATURED TOGGLE CHECKBOX -->
                    <div class="bg-amber-50 border border-amber-200 p-3 rounded flex items-center gap-2">
                        <input type="checkbox" id="p-featured" class="w-4 h-4 text-blue-600 rounded cursor-pointer">
                        <label for="p-featured" class="font-bold text-amber-900 cursor-pointer">Show this property in Home Page Recommended Properties section</label>
                    </div>

                    <div>
                        <label class="font-bold block mb-1">Description</label>
                        <textarea id="p-desc" rows="3" class="w-full border p-2 rounded" placeholder="Short description about location, connectivity, amenities..."></textarea>
                    </div>
                </div>

                <!-- TAB 2: DETAILS -->
                <div id="tab-details" class="tab-content hidden space-y-3">
                    <div class="grid grid-cols-3 gap-3">
                        <div><label class="font-bold block mb-1">Carpet Area (sq.ft)</label><input type="text" id="p-carpet" class="w-full border p-2 rounded" placeholder="690"></div>
                        <div><label class="font-bold block mb-1">Bedrooms</label><input type="text" id="p-bedrooms" class="w-full border p-2 rounded" placeholder="2"></div>
                        <div><label class="font-bold block mb-1">Bathrooms</label><input type="text" id="p-bathrooms" class="w-full border p-2 rounded" placeholder="2"></div>
                    </div>
                    <div class="grid grid-cols-3 gap-3">
                        <div><label class="font-bold block mb-1">Balconies</label><input type="text" id="p-balconies" class="w-full border p-2 rounded" placeholder="1"></div>
                        <div><label class="font-bold block mb-1">Floor No.</label><input type="text" id="p-floor" class="w-full border p-2 rounded" placeholder="4"></div>
                        <div><label class="font-bold block mb-1">Total Floors</label><input type="text" id="p-total-floors" class="w-full border p-2 rounded" placeholder="18"></div>
                    </div>
                    <div class="grid grid-cols-3 gap-3">
                        <div>
                            <label class="font-bold block mb-1">Facing</label>
                            <select id="p-facing" class="w-full border p-2 rounded">
                                <option value="East">East</option>
                                <option value="West">West</option>
                                <option value="North">North</option>
                                <option value="South">South</option>
                                <option value="North-East">North-East</option>
                            </select>
                        </div>
                        <div><label class="font-bold block mb-1">Parking</label><input type="text" id="p-parking" class="w-full border p-2 rounded" placeholder="1 Covered"></div>
                        <div>
                            <label class="font-bold block mb-1">Furnishing</label>
                            <select id="p-furnishing" class="w-full border p-2 rounded">
                                <option value="Semi Furnished">Semi Furnished</option>
                                <option value="Fully Furnished">Fully Furnished</option>
                                <option value="Unfurnished">Unfurnished</option>
                            </select>
                        </div>
                    </div>
                    <div class="grid grid-cols-3 gap-3">
                        <div>
                            <label class="font-bold block mb-1">Possession Status</label>
                            <select id="p-possession" class="w-full border p-2 rounded">
                                <option value="Ready Possession">Ready Possession</option>
                                <option value="Under Construction">Under Construction</option>
                            </select>
                        </div>
                        <div>
                            <label class="font-bold block mb-1">Ownership Type</label>
                            <select id="p-ownership" class="w-full border p-2 rounded">
                                <option value="Co-operative Society">Co-operative Society</option>
                                <option value="Freehold">Freehold</option>
                                <option value="Leasehold">Leasehold</option>
                            </select>
                        </div>
                        <div><label class="font-bold block mb-1">RERA Number</label><input type="text" id="p-rera" class="w-full border p-2 rounded" placeholder="P5170303"></div>
                    </div>
                    <div>
                        <label class="font-bold block mb-1">Highlights (One per line)</label>
                        <textarea id="p-highlights" rows="2" class="w-full border p-2 rounded" placeholder="Legally checked and verified by Tricore&#10;690 sq.ft. usable area&#10;Ready possession"></textarea>
                    </div>
                </div>

                <!-- TAB 3: MEDIA -->
                <div id="tab-media" class="tab-content hidden space-y-3">
                    <div>
                        <label class="font-bold block mb-1">Upload Property Photos (Select Multiple)</label>
                        <input type="file" id="p-files" accept="image/*" multiple class="w-full border p-2 rounded bg-slate-50">
                        <p id="upload-status" class="text-[11px] text-blue-600 font-semibold mt-1 hidden">Uploading images...</p>
                        <div id="image-previews" class="flex flex-wrap gap-2 mt-3"></div>
                    </div>
                </div>

                <!-- TAB 4: AMENITIES -->
                <div id="tab-amenities" class="tab-content hidden space-y-2">
                    <label class="font-bold block mb-2">Select Amenities Available</label>
                    <div class="grid grid-cols-3 gap-2">
                        <label class="flex items-center gap-1.5 p-2 border rounded bg-slate-50 cursor-pointer"><input type="checkbox" name="amenity" value="Parking"> Parking</label>
                        <label class="flex items-center gap-1.5 p-2 border rounded bg-slate-50 cursor-pointer"><input type="checkbox" name="amenity" value="Lift"> Lift</label>
                        <label class="flex items-center gap-1.5 p-2 border rounded bg-slate-50 cursor-pointer"><input type="checkbox" name="amenity" value="Power Backup"> Power Backup</label>
                        <label class="flex items-center gap-1.5 p-2 border rounded bg-slate-50 cursor-pointer"><input type="checkbox" name="amenity" value="Swimming Pool"> Swimming Pool</label>
                        <label class="flex items-center gap-1.5 p-2 border rounded bg-slate-50 cursor-pointer"><input type="checkbox" name="amenity" value="Gym"> Gym</label>
                        <label class="flex items-center gap-1.5 p-2 border rounded bg-slate-50 cursor-pointer"><input type="checkbox" name="amenity" value="Garden"> Garden</label>
                        <label class="flex items-center gap-1.5 p-2 border rounded bg-slate-50 cursor-pointer"><input type="checkbox" name="amenity" value="Club House"> Club House</label>
                        <label class="flex items-center gap-1.5 p-2 border rounded bg-slate-50 cursor-pointer"><input type="checkbox" name="amenity" value="Kids Play Area"> Kids Play Area</label>
                        <label class="flex items-center gap-1.5 p-2 border rounded bg-slate-50 cursor-pointer"><input type="checkbox" name="amenity" value="Security"> Security</label>
                        <label class="flex items-center gap-1.5 p-2 border rounded bg-slate-50 cursor-pointer"><input type="checkbox" name="amenity" value="CCTV"> CCTV</label>
                        <label class="flex items-center gap-1.5 p-2 border rounded bg-slate-50 cursor-pointer"><input type="checkbox" name="amenity" value="Temple"> Temple</label>
                        <label class="flex items-center gap-1.5 p-2 border rounded bg-slate-50 cursor-pointer"><input type="checkbox" name="amenity" value="School Nearby"> School Nearby</label>
                    </div>
                </div>

                <div class="flex justify-end gap-2 pt-3 border-t">
                    <button type="button" onclick="closeForm()" class="border px-4 py-2 rounded font-bold">Cancel</button>
                    <button type="submit" id="save-btn" class="bg-blue-600 text-white font-bold px-6 py-2 rounded">Save Property</button>
                </div>
            </form>
        </div>
    </div>

    <!-- SCRIPT -->
    <script>
        const SUPABASE_URL = "https://pccvfdvsufqnlnvcdrxk.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_JVqfPJWwmLrAMk7_nXp0pA_OwsvTnVt";

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        let propertiesData = [];
        let currentUploadedImages = [];

        document.getElementById('login-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            const pass = document.getElementById('password').value.trim();
            if (pass === 'Tricore@2026') {
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('dashboard-screen').classList.remove('hidden');
                document.getElementById('dashboard-screen').classList.add('flex');
                await fetchProperties();
            } else {
                alert('Invalid Password');
            }
        });

        function handleLogout() { location.reload(); }

        function switchAdminTab(tabId, el) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.add('hidden'));
            document.querySelectorAll('.admin-tab').forEach(t => {
                t.classList.remove('text-blue-600', 'border-blue-600');
                t.classList.add('border-transparent');
            });
            document.getElementById(tabId).classList.remove('hidden');
            el.classList.add('text-blue-600', 'border-blue-600');
            el.classList.remove('border-transparent');
        }

        async function fetchProperties() {
            try {
                const { data, error } = await supabaseClient.from('properties').select('*').order('created_at', { ascending: false });
                if (error) { alert("Supabase Error: " + error.message); return; }
                propertiesData = data || [];
                renderProperties();
            } catch (err) { alert("Connection failed: " + err.message); }
        }

        function renderProperties() {
            const list = document.getElementById('properties-list');
            document.getElementById('stat-total').innerText = propertiesData.length;
            document.getElementById('stat-published').innerText = propertiesData.filter(p => p.status === 'Published').length;
            document.getElementById('stat-drafts').innerText = propertiesData.filter(p => p.status === 'Draft').length;
            document.getElementById('stat-featured').innerText = propertiesData.filter(p => p.is_featured).length;

            if (propertiesData.length === 0) {
                list.innerHTML = `<tr><td colspan="6" class="p-4 text-center text-slate-400">No properties in database. Click + Add New Property.</td></tr>`;
                return;
            }

            list.innerHTML = '';
            propertiesData.forEach(item => {
                const isFeatured = item.is_featured;
                list.innerHTML += `
                    <tr class="hover:bg-slate-50">
                        <td class="p-3 font-bold text-slate-800">${item.title}</td>
                        <td class="p-3 text-slate-600">${item.region}</td>
                        <td class="p-3 text-blue-700 font-bold">${item.price}</td>
                        <td class="p-3">
                            <button onclick="toggleFeatured('${item.id}', ${isFeatured})" class="px-2 py-1 rounded text-[10px] font-bold ${isFeatured ? 'bg-purple-100 text-purple-700 border border-purple-300' : 'bg-slate-100 text-slate-500 border'}">
                                ${isFeatured ? '★ Recommended' : '☆ Standard'}
                            </button>
                        </td>
                        <td class="p-3"><span class="bg-emerald-100 text-emerald-800 px-2 py-0.5 rounded text-[10px] font-bold">${item.status || 'Published'}</span></td>
                        <td class="p-3 text-right space-x-2">
                            <button onclick="editProperty('${item.id}')" class="text-blue-600 font-bold">Edit</button>
                            <button onclick="deleteProperty('${item.id}')" class="text-red-600 font-bold">Delete</button>
                        </td>
                    </tr>
                `;
            });
        }

        async function toggleFeatured(id, currentStatus) {
            const { error } = await supabaseClient.from('properties').update({ is_featured: !currentStatus }).eq('id', id);
            if (error) alert("Error toggling featured status: " + error.message);
            else fetchProperties();
        }

        function openForm() { 
            document.getElementById('p-id').value = '';
            currentUploadedImages = [];
            renderImagePreviews();
            document.getElementById('property-form').reset();
            document.querySelectorAll('input[name="amenity"]').forEach(cb => cb.checked = false);
            document.getElementById('modal-title').innerText = 'Add New Property';
            document.getElementById('property-modal').classList.remove('hidden'); 
        }

        function closeForm() { document.getElementById('property-modal').classList.add('hidden'); }

        function renderImagePreviews() {
            const container = document.getElementById('image-previews');
            container.innerHTML = '';
            currentUploadedImages.forEach((url, index) => {
                container.innerHTML += `
                    <div class="relative w-16 h-16 border rounded overflow-hidden">
                        <img src="${url}" class="w-full h-full object-cover">
                        <button type="button" onclick="removeImage(${index})" class="absolute top-0 right-0 bg-red-600 text-white text-[10px] px-1 font-bold">×</button>
                    </div>
                `;
            });
        }

        function removeImage(index) {
            currentUploadedImages.splice(index, 1);
            renderImagePreviews();
        }

        function editProperty(id) {
            const prop = propertiesData.find(p => p.id === id);
            if (!prop) return;

            document.getElementById('p-id').value = prop.id;
            document.getElementById('p-title').value = prop.title || '';
            document.getElementById('p-price').value = prop.price || '';
            document.getElementById('p-region').value = prop.region || 'All Mumbai';
            document.getElementById('p-location').value = prop.location || '';
            document.getElementById('p-category').value = prop.category || '1, 2, 3, 4 BHK Flats';
            document.getElementById('p-desc').value = prop.description || '';
            document.getElementById('p-featured').checked = !!prop.is_featured;

            document.getElementById('p-carpet').value = prop.carpet_area || '';
            document.getElementById('p-bedrooms').value = prop.bedrooms || '';
            document.getElementById('p-bathrooms').value = prop.bathrooms || '';
            document.getElementById('p-balconies').value = prop.balconies || '';
            document.getElementById('p-floor').value = prop.floor_no || '';
            document.getElementById('p-total-floors').value = prop.total_floors || '';
            document.getElementById('p-facing').value = prop.facing || 'East';
            document.getElementById('p-parking').value = prop.parking || '';
            document.getElementById('p-furnishing').value = prop.furnishing || 'Semi Furnished';
            document.getElementById('p-possession').value = prop.possession_status || 'Ready Possession';
            document.getElementById('p-ownership').value = prop.ownership_type || 'Co-operative Society';
            document.getElementById('p-rera').value = prop.rera_number || '';
            document.getElementById('p-highlights').value = prop.highlights || '';

            const selectedAmenities = prop.amenities || [];
            document.querySelectorAll('input[name="amenity"]').forEach(cb => {
                cb.checked = selectedAmenities.includes(cb.value);
            });

            currentUploadedImages = prop.images || [];
            renderImagePreviews();

            document.getElementById('modal-title').innerText = 'Edit Property';
            document.getElementById('property-modal').classList.remove('hidden');
        }

        document.getElementById('property-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const saveBtn = document.getElementById('save-btn');
            const fileInput = document.getElementById('p-files');
            const statusText = document.getElementById('upload-status');

            saveBtn.disabled = true;

            if (fileInput.files.length > 0) {
                statusText.classList.remove('hidden');
                for (let file of fileInput.files) {
                    const fileExt = file.name.split('.').pop();
                    const fileName = `${Date.now()}-${Math.random().toString(36).substring(7)}.${fileExt}`;

                    const { error } = await supabaseClient.storage.from('property-images').upload(fileName, file);
                    if (error) {
                        alert("Image Upload Error: " + error.message);
                        statusText.classList.add('hidden');
                        saveBtn.disabled = false;
                        return;
                    }

                    const { data: publicUrlData } = supabaseClient.storage.from('property-images').getPublicUrl(fileName);
                    currentUploadedImages.push(publicUrlData.publicUrl);
                }
                statusText.classList.add('hidden');
            }

            if (currentUploadedImages.length === 0) {
                currentUploadedImages.push('https://images.unsplash.com/photo-1600585154526-990dced4db0d?auto=format&fit=crop&w=600&q=80');
            }

            const chosenAmenities = [];
            document.querySelectorAll('input[name="amenity"]:checked').forEach(cb => chosenAmenities.push(cb.value));

            const id = document.getElementById('p-id').value;
            const payload = {
                title: document.getElementById('p-title').value,
                price: document.getElementById('p-price').value,
                region: document.getElementById('p-region').value,
                location: document.getElementById('p-location').value,
                category: document.getElementById('p-category').value,
                description: document.getElementById('p-desc').value,
                is_featured: document.getElementById('p-featured').checked,
                carpet_area: document.getElementById('p-carpet').value,
                bedrooms: document.getElementById('p-bedrooms').value,
                bathrooms: document.getElementById('p-bathrooms').value,
                balconies: document.getElementById('p-balconies').value,
                floor_no: document.getElementById('p-floor').value,
                total_floors: document.getElementById('p-total-floors').value,
                facing: document.getElementById('p-facing').value,
                parking: document.getElementById('p-parking').value,
                furnishing: document.getElementById('p-furnishing').value,
                possession_status: document.getElementById('p-possession').value,
                ownership_type: document.getElementById('p-ownership').value,
                rera_number: document.getElementById('p-rera').value,
                highlights: document.getElementById('p-highlights').value,
                amenities: chosenAmenities,
                images: currentUploadedImages,
                status: 'Published'
            };

            let res;
            if (id) {
                res = await supabaseClient.from('properties').update(payload).eq('id', id);
            } else {
                res = await supabaseClient.from('properties').insert([payload]);
            }

            saveBtn.disabled = false;

            if (res.error) {
                alert("Error saving property: " + res.error.message);
            } else {
                closeForm();
                document.getElementById('property-form').reset();
                fetchProperties();
            }
        });

        async function deleteProperty(id) {
            if (confirm("Delete this property?")) {
                const { error } = await supabaseClient.from('properties').delete().eq('id', id);
                if (error) alert("Error deleting: " + error.message);
                else fetchProperties();
            }
        }
    </script>
